name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afghanai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: afghanai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afghanai -d afghanai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://afghanai:ci-only-password@localhost:5432/afghanai_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply initial schema to disposable CI database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.sql
      - name: Verify PostgreSQL schema and constraints
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/verify_initial_schema.sql
      - name: Run backend tests
        run: pytest -q
