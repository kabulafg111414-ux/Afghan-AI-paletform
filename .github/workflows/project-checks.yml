name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-config:
    name: JavaScript syntax and manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check backend/social-support-worker.mjs

      - name: Check navigation targets and page sections
        run: node scripts/check-navigation.mjs

      - name: Check Dari, Pashto and English localization
        run: node scripts/check-localization.mjs

      - name: Check offline app-shell assets and local references
        run: node scripts/check-app-shell.mjs

      - name: Check core interface interactions and financial validations
        run: node scripts/check-core-interactions.mjs

      - name: Build and verify Cloudflare static deployment bundle
        run: |
          npm run build
          node -e "const c=JSON.parse(require('node:fs').readFileSync('wrangler.jsonc','utf8')); if(c.assets?.directory!=='./dist') throw new Error('Wrangler assets directory must be ./dist'); if(c.main) throw new Error('Static-only worker must not expose an unintended script entry point'); console.log('Wrangler static-assets configuration is valid')"

      - name: Validate web app manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json is valid JSON')"

      - name: Confirm core application files exist
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s sw.js
          test -s manifest.json
          test -s icon.svg
          test -s social-support-center.html
          test -s assets/afghan-ai-social-hero.svg
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/styles.css
          test -s dist/sw.js
          test -s dist/manifest.json
          test -s dist/icon.svg
          test -s dist/social-support-center.html
          test -s dist/assets/afghan-ai-logo.svg
          test -s dist/assets/afghan-ai-social-hero.svg
          test ! -e dist/backend
          test ! -e dist/docs
          test ! -e dist/server.py
