services:
  - type: web
    name: afghan-ai-paletform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker avoids duplicating the in-memory rate-limit store and reduces RAM use on the free instance.
    # Threads preserve limited concurrency; use shared Redis/Valkey before scaling to multiple workers/instances.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
